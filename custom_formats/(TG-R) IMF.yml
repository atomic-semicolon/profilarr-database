name: (TG-R) IMF
description: 'IMF (Interoperable Master Format) isn''t a streaming service but a standardized
  file format for storing and delivering finished video content.

  Releases that use IMF as a source are created from the highest available source,
  resulting in a higher-quality WEBRip than those sourced from standard streaming
  delivery files.

  IMF is widely used by major studios and streaming platforms to manage and distribute
  large catalogs of content efficiently and consistently.

  For more information, visit the [IMF Explainer page](https://www.imfug.com/explainer/imf-explainer-en/)
  and the [Interoperable Master Format Wikipedia page](https://en.wikipedia.org/wiki/Interoperable_Master_Format).'
tags:
- TRaSH
- Radarr Only
conditions:
- name: Interoperable Master Format
  type: release_title
  required: true
  negate: false
  pattern: Interoperable Master Format

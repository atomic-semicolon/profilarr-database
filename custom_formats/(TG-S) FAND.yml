name: (TG-S) FAND
description: 'Fandango is an American video-on-demand streaming service, originally
  founded as Vudu in 2004. It was acquired by Walmart in 2010, then sold to Fandango
  Media in 2020, and has since been rebranded from Vudu to Fandango at Home, and finally
  to simply Fandango in 2026. It offers over 150,000 movies and TV shows available
  to rent or buy, including new releases in up to 4K UHD with Dolby Vision HDR, as
  well as a selection of free ad-supported titles with no subscription required.

  For more information, visit the [Fandango Wikipedia page](https://en.wikipedia.org/wiki/Fandango_(streaming_service)).'
